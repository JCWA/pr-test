name: PR 자동 리뷰 & 테스트

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

jobs:
  ai-review-and-test:
    name: AI 리뷰 & 테스트
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      
      - name: 의존성 설치
        run: yarn install --frozen-lockfile
      
      # 1. Lint & Build
      - name: 코드 린트 검사
        id: lint
        run: yarn lint
        continue-on-error: true
      
      - name: 프로젝트 빌드
        id: build
        run: yarn build
        continue-on-error: true
      
      # 2. AI 코드 리뷰
      - name: AI 코드 리뷰
        id: code-review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/ai-code-review.js
        continue-on-error: true
      
      # 3. 테스트 코드 생성
      - name: 테스트 코드 생성
        id: generate-tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/generate-tests.js
        continue-on-error: true
      
      # 4. 테스트 실행
      - name: 단위 테스트 실행
        id: unit-tests
        run: yarn test --coverage
        continue-on-error: true
      
      - name: E2E 테스트 실행
        id: e2e-tests
        run: yarn test:e2e
        continue-on-error: true
      
      # 5. 커버리지 업로드
      - name: 커버리지 리포트 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
      
      # 6. 최종 요약 코멘트
      - name: PR에 요약 게시
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let summary = '# 🤖 자동 PR 리뷰 요약\n\n';
            
            // 빌드 상태
            summary += '## 🏗️ 빌드 & 린트\n';
            summary += '- 린트: ${{ steps.lint.outcome }}\n';
            summary += '- 빌드: ${{ steps.build.outcome }}\n\n';
            
            // 커버리지
            summary += '## 📊 테스트 커버리지\n';
            try {
              const coverage = fs.readFileSync('coverage/coverage-summary.json', 'utf8');
              const data = JSON.parse(coverage);
              summary += `- 라인: ${data.total.lines.pct}%\n`;
              summary += `- 구문: ${data.total.statements.pct}%\n`;
              summary += `- 함수: ${data.total.functions.pct}%\n`;
              summary += `- 분기: ${data.total.branches.pct}%\n\n`;
            } catch (e) {
              summary += '⚠️ 커버리지 데이터를 사용할 수 없습니다\n\n';
            }
            
            // 테스트 상태
            summary += '## 🧪 테스트\n';
            summary += '- 단위 테스트: ${{ steps.unit-tests.outcome }}\n';
            summary += '- E2E 테스트: ${{ steps.e2e-tests.outcome }}\n\n';
            
            summary += '---\n';
            summary += '💡 위의 개별 코멘트에서 상세한 AI 코드 리뷰와 제안사항을 확인하세요.\n';
            summary += '📖 모범 사례는 [코드 리뷰 가이드라인](https://github.com/jcwa/guide/blob/main/CODE_REVIEW_GUIDE.md)을 참고하세요.\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
